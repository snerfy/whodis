name: Tests

# Runs the compatibility tests (stock chat, EllesmereUI Chat, Better Forever Chat,
# Chattynator, Prat) on every branch push and pull request. Lua 5.1 is what the game
# uses; 5.4 is a second check.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: [lua5.1, lua5.4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ${{ matrix.lua }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.lua }}

      - name: Run tests
        run: LUA=${{ matrix.lua }} bash tests/run.sh
